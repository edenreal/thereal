# .github/workflows/lodging-monitor.yml
name: 숙박 매물 감시
on:
  schedule:
    # CRM 광고 갱신(집 PC)이 한국 09:00·14:00. GitHub 예약 실행은 2~5시간씩 밀려서(2026-10 실측: 07시 예약 → 09:26 시작, 19시 예약 → 23:55 시작) 일찍 걸어 둠.
    # 저녁 글은 다음 날 새벽 실행에 잡힘(14일 안 글은 다 봄). 2026-10-23 변경(이전 07시·19시).
    - cron: '0 19 * * *'    # UTC 19:00 = 한국 새벽 4시 → 09시 갱신 전에 끝나게
    - cron: '0 1 * * *'     # UTC 01:00 = 한국 오전 10시 → 14시 갱신 전에 끝나게
  workflow_dispatch:          # 수동 실행 버튼
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth requests feedparser openai
      - name: Run monitor
        env:
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python naver_lodging_monitor.py
